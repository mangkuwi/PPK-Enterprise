# Jalankan: cp .env.example .env (isi nilainya), lalu docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "gateway"], interval: 10s, retries: 5 }

  gateway:
    build: .
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD}@postgres:5432/gateway
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:?}
      WA_APP_SECRET: ${WA_APP_SECRET:?}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:?}
      WA_GRAPH_VERSION: ${WA_GRAPH_VERSION:-v21.0}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [gateway]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?}" }
    volumes:
      - ./nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro

volumes:
  pgdata:
