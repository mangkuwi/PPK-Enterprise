# Modul PPK di PostgreSQL asli (Tahap 6, server LAN). Runner Linux murah, jadi jalan di setiap push dan PR.
name: PostgreSQL
on:
  push: { branches: ['**'] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'pg-${{ github.ref }}', cancel-in-progress: true }
env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1', ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { pg: ['13', '16'] } # 13 = versi tertua yang didukung (DROP DATABASE ... WITH (FORCE) di test butuh 13+)
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_PASSWORD: uji }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - run: npx vitest run tests/ppk-postgres.test.ts
        env: { PPK_TEST_PG: 'postgres://postgres:uji@127.0.0.1:5432/postgres' }
